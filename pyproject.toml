[project]
name = "broker-analysis-mcp"
version = "0.5.0"
description = "MCP server for financial analysis on Yahoo Finance data with local audit records"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.12.0",
    "filelock>=3.20.0",
    "matplotlib>=3.11.2",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "yfinance>=1.7.0",
]

[project.scripts]
broker-analysis-mcp = "broker_analysis_mcp.server:main"
broker-analysis-hooks = "broker_analysis_mcp.hooks:main"
broker-analysis-monitor = "broker_analysis_mcp.monitoring:main"
broker-analysis-archive = "broker_analysis_mcp.archive:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "empyrical-reloaded>=0.7.0",
    "pytest>=9.1.1",
    "ruff==0.17.1",
    "ta>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["live: needs network access to Yahoo Finance"]
addopts = "-m 'not live'"

[tool.ruff]
# Lint, not format: `ruff format` would rewrite every hand-aligned table in one diff, and line
# length is left to review for the same reason (E501 is off).
required-version = "==0.17.1"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["broker_analysis_mcp"]
