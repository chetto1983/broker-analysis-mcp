name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check .
      # Offline only: the live tier reads Yahoo Finance, which a CI runner cannot be trusted to reach.
      - run: uv run pytest
      - run: uv run python scripts/operational_acceptance.py --fixture --requests 100 --concurrency 4 --output operational-evidence.json
